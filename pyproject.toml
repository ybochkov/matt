[project]
name = "matt-tokenizer-transfer"
version = "0.1.0"
description = "Model-Aware Tokenizer Transfer - A library for transferring tokenizers between models using Attention Influence Modeling"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mykola Haltiuk", email = "kaljandlux@gmail.com"},
]
maintainers = [
    {name = "Mykola Haltiuk", email = "kaljandlux@gmail.com"},
]
keywords = ["tokenizer", "transfer", "nlp", "transformers", "machine-learning", "attention", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0,<5.0.0",
    "tokenizers>=0.13.0",
    "datasets>=4.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "deepfocus>=1.0.0,<2.0.0",
    "lightning>=2.0.0",
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.15.0",
]
all = [
    "matt-tokenizer-transfer[wandb]",
]

[project.urls]
Homepage = "https://github.com/Goader/matt"
Documentation = "https://github.com/Goader/matt#readme"
Repository = "https://github.com/Goader/matt.git"
Issues = "https://github.com/Goader/matt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matt"]

